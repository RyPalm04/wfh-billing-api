spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eternatel_billing_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:local_password}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:18080}
  servlet:
    context-path: /api/v1

api:
  key: ${API_KEY:12345}

cors:
  allowed-origins:
    - ${CORS_ORIGIN_LOCAL:http://localhost:5173}
    - ${CORS_ORIGIN_PROD:https://wfh-billing*.vercel.app}

github:
  token: ${GH_TOKEN:mock-github-token}
  repo: RyPalm04/wfh-billing

supabase:
  jwks-uri: ${SUPABASE_JWKS_URI:https://folvyylfgqdonysflsru.supabase.co/auth/v1/.well-known/jwks.json}