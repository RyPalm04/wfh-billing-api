spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:18080}

api:
  key: ${API_KEY}

cors:
  allowed-origins:
    - ${CORS_ORIGIN_LOCAL:http://localhost:5173}
    - ${CORS_ORIGIN_PROD:https://wfh-billing*.vercel.app}

github:
  token: ${GH_TOKEN}
  repo: RyPalm04/wfh-billing

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET}
